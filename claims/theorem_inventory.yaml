  - theorem_id: THM-RLM-ISOLATION
    assumptions:
      - A-RLM-005: Sandbox enforces partition boundaries
    lean_module: Proofs/RLMContracts.lean
    dependencies: []
    proof_status: axiom
    tier: deployment-assumption
    axiom_profile: [Fulcrum.RLM.canAccess, Fulcrum.RLM.context_partition_isolation]
    notes: >
      Deployment assumption — a systems property of the runtime sandbox, never
      Proved. The published D4 frames it the same way (Appendix B: "Isolation
      remains an assumption. Context partition isolation is axiomatized rather
      than derived: the proofs specify what a correct sandbox must enforce,
      but they do not prove that any given container or microVM implementation
      actually provides that isolation."; §6 Limitations echoes this; DOI
      10.5281/zenodo.19900714). Hardware-attested isolation (SEV-SNP/TDX TEEs,
      gVisor/Firecracker microVMs) shifts the trust basis of this axiom rather
      than eliminating it. No artifact may claim "formally verified
      isolation". These two axioms are the entire first-party axiom surface —
      the repo is deliberately not "axiom-free"; "0 sorrys" remains the
      enforced invariant.
