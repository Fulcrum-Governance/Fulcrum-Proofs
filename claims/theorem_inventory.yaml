  - theorem_id: THM-NASH-PURE-EXISTENCE
    assumptions:
      - A-GAME-001: agents have finite action sets (4 actions)
      - A-GAME-002: budget = 25 * agentCount (tight budget)
      - A-GAME-003: violation penalty (20) > quality gain from noncompliance (1)
    lean_module: Proofs/GameTheory/NashExistence.lean
    dependencies: [THM-BUDGET-LOCAL]
    proof_status: proven
    axiom_profile: [propext, Classical.choice, Quot.sound]
    notes: Pure-strategy Nash existence, deviation arithmetic, and all-moderate equilibrium
      proofs are now sorry-free.
  - theorem_id: THM-NASH-MIXED-EXISTENCE
    assumptions:
      - A-GAME-004: finite strategy sets (Fintype)
      - A-GAME-005: real-valued continuous payoffs
    lean_module: Proofs/GameTheory/MixedNashExistence.lean
    dependencies: [THM-NASH-PURE-EXISTENCE, EXT-EXISTS-NASH-EQ]
    proof_status: proven
    axiom_profile: [propext, Classical.choice, Quot.sound]
    sorry_count: 0
    external_refs:
      - id: EXT-EXISTS-NASH-EQ
        source: math-xmum-brouwer-fork
        ref: fulcrum-v4.29-port
        path: Gametheory/Nash.lean
        symbol: ExistsNashEq
        notes: Brouwer fixed-point on product simplices (via Scarf's Lemma) yields
          mixed Nash existence for arbitrary FinGame. Bridged to our PMF-based
          MixedStrategyProfile through `pmfToSimplex`/`simplexToPMF`.
    notes: Mixed Nash existence is now sorry-free. Closed via math-xmum/Brouwer's
      `ExistsNashEq` applied through a PMF ↔ stdSimplex bridge
      (`expectedPayoff_eq_mixed_g`). The prior `kakutani_fixed_point_theorem` axiom
      has been removed.
  - theorem_id: THM-NASH-UNIQUENESS
    assumptions:
      - A-GAME-001: agents have finite action sets (4 actions)
      - A-GAME-002: budget = 25 * agentCount (tight budget)
      - A-GAME-003: violation penalty (20) > quality gain from noncompliance (1)
      - A-GAME-006: agentCount in range 2..12
    lean_module: Proofs/GameTheory/NashUniqueness.lean
    dependencies: [THM-NASH-PURE-EXISTENCE, THM-NONCOMPLIANT-DOMINATED]
    proof_status: proven
    axiom_profile: [propext, Classical.choice, Quot.sound]
    sorry_count: 0
    notes: >
      Proves all Nash equilibria under tight budget are the all-moderate profile
      (nash_eq_allModerate). Used by fulcrum_poa_bounded and constrained_poa_exact
      to close the PoA bounds. Exhaustive for agentCount in 2..12; the bound is
      a parameter hypothesis, not a proof limitation.
  - theorem_id: THM-NONCOMPLIANT-DOMINATED
    assumptions: [A-GAME-003]
    lean_module: Proofs/GameTheory/NashExistence.lean
    dependencies: []
    proof_status: proven
    axiom_profile: [propext, Classical.choice, Quot.sound]
    notes: Strict domination is now proven via explicit single-agent token update and
      overflow monotonicity.
  - theorem_id: THM-NOT-DSIC
    assumptions:
      - A-MECH-001: proportional allocation with allocationUtility = -|allocation - trueNeed|
    lean_module: Proofs/GameTheory/IncentiveCompatibility.lean
    dependencies: []
    proof_status: proven
    axiom_profile: [propext, Classical.choice, Quot.sound]
    notes: Truthful allocation sufficiency is proven, but DSIC is disproven by an explicit
      two-agent oversupply counterexample; the file now proves the negative result sorry-free.
  - theorem_id: THM-POA-BOUNDED
    assumptions: [A-GAME-001, A-GAME-002]
    lean_module: Proofs/GameTheory/CoordinationEfficiency.lean
    dependencies: [THM-NASH-PURE-EXISTENCE]
    proof_status: proven
    axiom_profile: [propext, Classical.choice, Quot.sound]
    sorry_count: 0
    notes: >
      Fully proven via NashUniqueness.lean (PR #6). All-moderate is the unique Nash
      equilibrium under tight budget; PoA ≤ 9/7 bound is sorry-free.
  - theorem_id: THM-POA-CONSTRAINED
    assumptions: [A-GAME-001, A-GAME-002]
    lean_module: Proofs/GameTheory/CoordinationEfficiency.lean
    dependencies: [THM-NASH-PURE-EXISTENCE, THM-POA-BOUNDED]
