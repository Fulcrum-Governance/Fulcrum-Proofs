  - theorem_id: THM-TEMPORAL-CONSERVATION-SPEC
    assumptions:
      - A-TEMP-001: request capability set is stable across a transition
      - A-TEMP-002: available capability set is monotonic across a transition
      - A-TEMP-003: per-hop revalidation semantics hold
