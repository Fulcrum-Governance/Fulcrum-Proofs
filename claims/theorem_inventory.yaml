  - theorem_id: THM-TRUST-DETECTION-BOUND
    assumptions:
      - A-TRUST-001
      - A-TRUST-003
      - A-TRUST-006: successes update via cappedSuccessUpdate with cap αMax
    lean_module: Proofs/KernelVariants.lean
    dependencies: [THM-TRUST-THRESHOLD, THM-TRUST-CAP-BOUNDED]
    proof_status: proven
    axiom_profile: [propext, Classical.choice, Quot.sound]
    sorry_count: 0
    provenance: >
      Ported byte-faithfully from d4-kernel-supplement.zip, Zenodo DOI
      10.5281/zenodo.19900714 — the published D4 Theorem 3.9
      (capped_prior_strict_responsiveness).
    notes: >
      Uniform detection-latency bound for the capped model — threshold
      crossing within q·(αMax+1) failures, independent of benign-phase
      length. CORRESPONDENCE (mandatory wherever cited): Proved for the
      discrete capped Lean model (Laplace (α+1)/(α+β+2) over Nat); the Lean
      witness is sufficient, not minimal. The deployed Python raw estimator
      (α/(α+β) over float, fulcrum-trust) has the tighter minimal bound
      β > α(q−p)/p — for θ=0.3 and α_max=20: Lean sufficient bound 210,
      raw-model minimal ≈47. Never present the Lean constant as operational
      detection latency without this note; the paper itself labels Thm 3.9
      "a hardened model variant, not a claim about the current
      implementation". Hoeffding/Mui statistical latency remains
      Tested/analytical, never Lean-proved.
