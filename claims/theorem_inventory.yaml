  - theorem_id: THM-POA-CONSTRAINED-INT
    assumptions:
      - A-GAME-001: agents have finite action sets (4 actions)
      - A-GAME-002: budget = 25 * agentCount (tight budget)
    lean_module: Proofs/GameTheory/CoordinationEfficiencyInt.lean
    dependencies: []
    proof_status: proven
    axiom_profile: [propext, Quot.sound]
    sorry_count: 0
    notes: >
      Integer-audit companion to THM-POA-CONSTRAINED (T2-B).
      constrained_welfare_optimal_int and constrained_poa_exact_int state the
      budget-feasible welfare optimum and the division-free PoA=1 form over
      List/Int by structural recursion — no reals, no Finset, no funext in the
      statements. Classical.choice-free; Quot.sound enters only via omega's
      reflective soundness machinery, not via any quotient-typed statement.
      Carries NO Nash quantifier (canonical exact equilibrium uniqueness is
      THM-NASH-UNIQUENESS-EXACT, kernel-1; legacy Real uniqueness remains
      kernel-3), and unlike the canonical full claim needs no
      n ≤ 12 hypothesis. netQuality15_spec pins the scaled numerals to the
      game model's own definitions. This additive companion is not a
      substitute for the canonical Nash-quantified claim.
