  - theorem_id: THM-BUDGET-GAME-BRIDGE
    assumptions: [A-BUDGET-001]
    lean_module: Proofs/GameTheory/BudgetGameBridge.lean
    dependencies: [THM-BUDGET-LOCAL]
    proof_status: proven
    axiom_profile: [propext, Classical.choice, Quot.sound]
    notes: budget_enforcement_grounds_game, governance_restricts_strategy_space, and
      budget_game_bridge are all now sorry-free.
  - theorem_id: THM-TRUST-MONOTONE
    assumptions:
      - A-TRUST-001: Trust score is Laplace-smoothed Beta distribution mean
      - A-TRUST-002: alpha, beta are natural numbers (interaction counts)
    lean_module: Proofs/TrustTermination.lean
    dependencies: []
    proof_status: proven
    axiom_profile: [propext, Classical.choice, Quot.sound]
    notes: Each additional failure strictly decreases trust. Proved via Nat
      cross-multiplication, avoiding Rat arithmetic entirely.
  - theorem_id: THM-TRUST-THRESHOLD
    assumptions:
      - A-TRUST-001
      - A-TRUST-003: Threshold is a rational p/q with 0 < p < q
    lean_module: Proofs/TrustTermination.lean
    dependencies: [THM-TRUST-MONOTONE]
    proof_status: proven
    axiom_profile: [propext, Classical.choice, Quot.sound]
    notes: Constructive proof — for any threshold and any alpha, there exists
      beta_star such that trust drops below threshold. Uses nlinarith.
  - theorem_id: THM-TRUST-TERMINATION
    assumptions:
      - A-TRUST-001
      - A-TRUST-004: Circuit breaker state is well-formed (consistent with trust vs threshold)
    lean_module: Proofs/TrustTermination.lean
    dependencies: [THM-TRUST-THRESHOLD]
    proof_status: proven
    axiom_profile: []
    notes: Circuit breaker is open iff trust is below threshold. Follows from
      well-formedness predicate definition.
  - theorem_id: THM-TRUST-GUARANTEED
    assumptions: [A-TRUST-001, A-TRUST-003]
    lean_module: Proofs/TrustTermination.lean
    dependencies: [THM-TRUST-MONOTONE, THM-TRUST-THRESHOLD]
    proof_status: proven
    axiom_profile: [propext, Classical.choice, Quot.sound]
    notes: Combining reachability with monotonicity — continued failures from any
      starting state guarantee termination.
  - theorem_id: THM-CIRCUIT-TRANSITIONS
    assumptions:
      - A-TRUST-005: Circuit breaker has 4 states (closed, open, halfOpen, terminated)
    lean_module: Proofs/TrustTermination.lean
    dependencies: []
    proof_status: proven
    axiom_profile: []
    notes: Valid transition relation with terminated as absorbing state.
      Proves no_closed_to_halfOpen (must go through open first).
