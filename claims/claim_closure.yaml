  - claim_id: C-018
    statement: Fulcrum coordination game admits a Nash equilibrium under budget constraints
    type: formal
    public_status: proven
    theorem_ids:
      - THM-NASH-PURE-EXISTENCE
      - THM-NASH-MIXED-EXISTENCE
      - THM-NONCOMPLIANT-DOMINATED
    runtime_evidence:
      - id: rt_nash_convergence_sim
        path: benchmarks/raw/nash-convergence.json
        repo: Fulcrum-Proofs
        description: >
          Simulation output confirming 100% convergence to the all-moderate
          equilibrium for the audited tight-budget instance.
    ci_jobs:
      - name: proof-gate.yml
        repo: Fulcrum-Proofs
      - name: model-gate.yml
        repo: Fulcrum-Proofs
    artifacts:
      - path: proofs/lean/Proofs/GameTheory/Definitions.lean
        type: lean_proof
      - path: proofs/lean/Proofs/GameTheory/FulcrumGame.lean
        type: lean_proof
      - path: proofs/lean/Proofs/GameTheory/NashExistence.lean
        type: lean_proof
      - path: proofs/lean/Proofs/GameTheory/MixedNashExistence.lean
        type: lean_proof
      - path: benchmarks/raw/nash-convergence.json
        type: benchmark_report
    external_dependencies:
      - name: math-xmum-brouwer-fork
        ref: fulcrum-v4.29-port
        purpose: Brouwer fixed-point on product simplices (Scarf's Lemma); supplies
          `ExistsNashEq` consumed by `mixed_nash_exists` through PMF ↔ stdSimplex bridge
    notes: >
      Pure-strategy Nash (all-moderate) and mixed-strategy Nash are both
      sorry-free. THM-NASH-MIXED-EXISTENCE (`mixed_nash_exists`) is closed
      via math-xmum/Brouwer's `ExistsNashEq` (Brouwer FPT on product simplices
      via Scarf's Lemma) through a PMF ↔ stdSimplex bridge in
      MixedNashExistence.lean. The previous `kakutani_fixed_point_theorem`
      axiom has been removed. No allowlisted sorry occurrences remain in
      no-sorry-check.log.

  - claim_id: C-019
    statement: Under allocationUtility = -|allocation - trueNeed|, proportional allocation is not dominant-strategy incentive-compatible
    type: formal
    public_status: proven
    theorem_ids:
      - THM-NOT-DSIC
    ci_jobs:
      - name: proof-gate.yml
        repo: Fulcrum-Proofs
    artifacts:
      - path: proofs/lean/Proofs/GameTheory/IncentiveCompatibility.lean
        type: lean_proof
    notes: >
      Negative result. Truthful allocation sufficiency is proven; DSIC is
      disproven by an explicit two-agent oversupply counterexample. Both
      halves sorry-free. Runtime evidence is not meaningful for a
      mathematical non-existence claim — closure rests on the Lean proof
      plus proof-gate replay.

