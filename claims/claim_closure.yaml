version: 1
updated_at: 2026-07-11
description: >
  Claim closure manifest linking every public claim to its theorem IDs,
  runtime test evidence, CI jobs, and artifact paths. Created per PRD-003.
  "Claim without artifact" is the anti-pattern this manifest prevents.
  An auditor, YC reviewer, or acquirer can trace any claim to its evidence
  without interpretation. This is a DOCUMENT deliverable (v0.1) — CI
  enforcement of these linkages is post-YC work.
authority_status: reconciled
demoted_at: 2026-05-06
demotion_reason: >
  Demoted 2026-05-06: at that time this manifest carried entry-level wording
  that contradicted claims/theorem_inventory.yaml (the theorem-level canonical
  source) — a "(private)" repo designation (Fulcrum-Proofs has been MIT/public
  since ADR-001/002, 2026-05-03) and a C-009 note marking
  THM-NASH-MIXED-EXISTENCE "proven-with-sorry" with a Kakutani-axiom dependency
  gap. Per-entry reconciliation was deferred as a Phase 2 follow-up.
reconciled_at: 2026-06-22
reconciliation_note: >
  Reconciled 2026-06-22 (the deferred Phase 2 follow-up). The repos map already
  reads "(MIT)" (see repos: below). C-009 now describes THM-NASH-MIXED-EXISTENCE
  as sorry-free with the kakutani_fixed_point_theorem axiom removed, and
  enumerates all 21 canonical theorem IDs (THM-NASH-UNIQUENESS and
  THM-POA-CONSTRAINED added). Every closure row now agrees with
  claims/theorem_inventory.yaml, which remains the canonical source for theorem
  status; this file links claims to evidence and is consistent with it.
superseded_by: claims/theorem_inventory.yaml

source_authority:
  claim_statements: claims/claim_scope.yaml
  theorem_definitions: claims/theorem_inventory.yaml
  evidence_history: claims/claim_ledger.yaml

repos:
