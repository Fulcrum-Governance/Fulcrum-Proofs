name: model-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  model-gate:
    name: model-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run toolchain preflight regressions
        run: make toolchain-preflight-test

      - name: Install checksum-pinned TLC
        run: bash scripts/tla_toolchain.sh --install

      - name: Run TLC checks
        run: make model-gate

      - name: Upload model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-gate-reports
          path: |
            models/tla/reports/**
            models/tla/traces/**
          if-no-files-found: warn
