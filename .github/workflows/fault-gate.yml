name: fault-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fault-gate:
    name: fault-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run fault campaign gate
        run: make fault-gate

      - name: Upload fault artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fault-gate-reports
          path: |
            fault/raw/*.json
          if-no-files-found: warn
