name: proof-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  proof-gate:
    name: proof-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify Lean tools
        run: |
          lake --version
          lean --version

      - name: Run proof replay
        run: make proof-gate

      - name: Run probe gate (kernel-level sorryAx + axiom profiles)
        run: make probe-gate

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-gate-reports
          path: |
            proofs/lean/reports/**
          if-no-files-found: warn
