name: bench-nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  bench-nightly:
    name: bench-nightly
    runs-on: ubuntu-latest
    environment: bench-nightly
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run nightly benchmark suite
        run: BENCH_USE_EXISTING=1 make bench-nightly

      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-nightly-reports
          path: |
            benchmarks/raw/*.json
          if-no-files-found: warn
